[package]
name = "tpt-av-test-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Procedural macros backing the tpt-av-test benchmark harness."
categories = ["development-tools::testing", "performance"]
keywords = ["benchmark", "real-time", "proc-macro"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"