[workspace]
resolver = "2"
members = [
    "tpt-av-test-reference",
    "tpt-av-test-fuzz",
    "tpt-av-test-benchmark",
    "tpt-av-test-macros",
    "tpt-av-test-mock",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tpt-solutions/tpt-av-test"
rust-version = "1.75"

[workspace.dependencies]
tpt-av-test-reference = { path = "tpt-av-test-reference", version = "0.1.0" }
tpt-av-test-fuzz = { path = "tpt-av-test-fuzz", version = "0.1.0" }
tpt-av-test-benchmark = { path = "tpt-av-test-benchmark", version = "0.1.0" }
tpt-av-test-macros = { path = "tpt-av-test-macros", version = "0.1.0" }
tpt-av-test-mock = { path = "tpt-av-test-mock", version = "0.1.0" }
proptest = "1.4"
criterion = "0.5"
tempfile = "3.10"
log = "0.4"
# Pinned below 0.25.8: starting there, image pulls in moxcms -> pxfm, whose
# rust-version is 1.85 regardless of the pxfm release picked, which breaks
# the 1.75 MSRV this workspace targets. Bump only once the MSRV moves too.
image = { version = ">=0.25, <0.25.8", default-features = false, features = ["png"] }